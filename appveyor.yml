image: Visual Studio 2026
version: 3.0.{build}
configuration: Release
branches:
  only:
  - master
init:
  # Good practise, because Windows line endings are different from Unix/Linux ones
  - cmd: git config --global core.autocrlf true
install:
  - ps: |
      $installer = "$env:TEMP\dotnet-install.ps1"

      Invoke-WebRequest `
        -Uri "https://dot.net/v1/dotnet-install.ps1" `
        -OutFile $installer

      & $installer `
        -Channel "10.0" `
        -Architecture x64 `
        -InstallDir "$env:ProgramFiles\dotnet"

      dotnet --list-sdks
  - ps: |
      $installer = "$env:TEMP\dotnet-install.ps1"

      Invoke-WebRequest `
        -Uri "https://dot.net/v1/dotnet-install.ps1" `
        -OutFile $installer

      & $installer `
        -Channel "11.0" `
        -Architecture x64 `
        -InstallDir "$env:ProgramFiles\dotnet"

      dotnet --list-sdks
before_build:
  # Display .NET Core version
  - cmd: dotnet --version
  # Display minimal restore text
  - cmd: dotnet restore ./src/Swashbuckle.AspNetCore.Filters/Swashbuckle.AspNetCore.Filters.csproj --verbosity m
build_script:
  # output will be in ./src/bin/debug/netcoreapp1.1/publish
  - cmd: dotnet build ./src/Swashbuckle.AspNetCore.Filters/Swashbuckle.AspNetCore.Filters.csproj
after_build:
  # For once the build has completed
artifacts:
 # - path: '\src\bin\Debug\netcoreapp1.1\publish'
 #  name: WebSite
 #  type: WebDeployPackage
clone_depth: 1
test_script:
  # restore packages for our unit tests
  - cmd: dotnet restore ./test/Swashbuckle.AspNetCore.Filters.Test/Swashbuckle.AspNetCore.Filters.Test.csproj --verbosity m
  # run the unit tests (requires changing into the test directory)
  - cmd: cd ./test/Swashbuckle.AspNetCore.Filters.Test
  - cmd: dotnet test
on_finish :
  # any cleanup in here
deploy: off